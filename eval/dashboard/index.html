      source: { file: "results", section: "History: not comparable" },
      scores: { firstTry: [1, 2], rightAfterRepairs: [2, 2] },
      answerTokens: 9467, closestClaude: "Claude 3.5 Haiku",
      perTask: { t1: "✓ pass", t2: "—", t3: "✗2 fixable", t4: "—", t5: "—", w1: "—" }
    },
    {
      id: "hist-35-on-v2", section: "history", date: "2026-11-03", label: "3.5 · on · v2", model: "qwen3.5:27b", think: "on", rules: "v2",
      source: { file: "results", section: "History: not comparable" },
      scores: { firstTry: [0, 1], rightAfterRepairs: [0, 1] },
      answerTokens: 10690, closestClaude: "Claude 3.5 Haiku",
      perTask: { t1: "—", t2: "—", t3: "—", t4: "—", t5: "—", w1: "✗6 unusable" }
    }
  ]
};
</script>

<script>
(function () {
  "use strict";
  var VERDICTS = [
    { key: "same", label: "same" }, { key: "close", label: "close" }, { key: "partial", label: "partial" },
    { key: "wrong", label: "wrong" }, { key: "noAnswer", label: "no answer" }
  ];
  var WORD_KEY = { "same": "same", "close": "close", "partial": "partial", "wrong": "wrong", "no answer": "noAnswer" };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return n == null ? "not recorded" : Number(n).toLocaleString("en-US"); }
  function pct(f) { return f && f[1] ? Math.round(100 * f[0] / f[1]) : null; }
  function get(o, path) { return path.split(".").reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function fileName(key) { return DATA.files[key] || key; }
  function setsFor(id) { return DATA.sets.filter(function (s) { return s.section === id; }); }
  function usableOf(v) { return (v.same || 0) + (v.close || 0); }

  function srcLine(sources) {
    return '<p class="src">Source: ' + sources.map(function (s) {
      return "<code>" + esc(fileName(s.file)) + "</code>, " + esc(s.section);
    }).join("; ") + "</p>";
  }
  function findingsList(items) {
    return items && items.length ? '<ul class="findings">' + items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" : "";
  }
  function caveatsBox(items) {
    return items && items.length ? '<div class="caveats"><h3>Caveats</h3><ul>' + items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>" : "";
  }
  function legend(withNone) {
    return '<div class="legend" aria-hidden="true">' + VERDICTS.filter(function (v) { return withNone || v.key !== "noAnswer"; }).map(function (v) {
      return '<span><i class="sw v-' + v.key + '"></i>' + v.label + "</span>";
    }).join("") + "</div>";
  }

  /* A single-series bar: label, value as "n of d · p%". */
  function barRow(label, sub, frac, opts) {
    opts = opts || {};
    var head = '<div class="row-head"><span class="row-label">' + esc(label) + (sub ? ' <span class="row-sub">' + esc(sub) + "</span>" : "") + "</span>";
    if (!frac) return '<div>' + head + '<span class="row-val">not recorded</span></div></div>';
    var p = pct(frac);
    return '<div title="' + esc(label + ": " + frac[0] + " of " + frac[1] + " (" + p + "%)") + '">' + head +
      '<span class="row-val"><b>' + frac[0] + " of " + frac[1] + "</b> · " + p + "%</span></div>" +
      '<div class="track" role="img" aria-label="' + esc(label + " " + frac[0] + " of " + frac[1]) + '"><div class="fill' + (opts.ref ? " ref" : "") + '" style="width:' + (100 * frac[0] / frac[1]) + '%"></div></div>' +
      (opts.note ? '<div class="na">' + esc(opts.note) + "</div>" : "") + "</div>";
  }

  /* A verdict stack: segments by count, counts written out below so colour is never the only cue. */
  function stackRow(label, sub, v, total) {
    var u = usableOf(v), p = Math.round(100 * u / total);
    var segs = VERDICTS.map(function (d) {
      var n = v[d.key] || 0;
      if (!n) return "";
      return '<span class="seg v-' + d.key + '" style="flex:' + n + ' 1 0" title="' + esc(d.label + ": " + n + " of " + total) + '">' + (n / total >= 0.07 ? n : "") + "</span>";
    }).join("");
    var key = VERDICTS.filter(function (d) { return d.key !== "noAnswer" || v.noAnswer; }).map(function (d) { return d.label + " " + (v[d.key] || 0); }).join(" · ");
    return '<div><div class="row-head"><span class="row-label">' + esc(label) + (sub ? ' <span class="row-sub">' + esc(sub) + "</span>" : "") + "</span>" +
      '<span class="row-val">usable <b>' + u + " of " + total + "</b> · " + p + "%</span></div>" +
      '<div class="stack" role="img" aria-label="' + esc(label + ": " + key + ", of " + total) + '">' + segs + "</div>" +
      '<div class="stack-key">' + esc(key) + " · of " + total + "</div></div>";
  }

  function chips(cell) {
    return '<span class="chips">' + String(cell).split(" / ").map(function (w) {
      var k = WORD_KEY[w.trim()];
      return k ? '<span class="chip v-' + k + '">' + esc(w.trim()) + "</span>" : esc(w);
    }).join("") + "</span>";
  }
  function table(head, rows, cls, wrapCls) {
    return '<div class="tbl-wrap ' + (wrapCls || "") + '" tabindex="0"><table class="' + (cls || "") + '"><thead>' + head + "</thead><tbody>" + rows + "</tbody></table></div>";
  }
  function headRow(cells) { return "<tr>" + cells.map(function (c) { return '<th class="' + (c.cls || "") + '" scope="col">' + esc(c.t) + "</th>"; }).join("") + "</tr>"; }
  function cellValue(set, col) {
    var v = get(set, col.path);
    if (v === undefined || v === null) return '<td class="num"></td>';
    if (col.type === "frac") return '<td class="num">' + v[0] + " of " + v[1] + "</td>";
    return '<td class="num">' + fmt(v) + "</td>";
  }

  /* ---------- Section renderers ---------- */
  function renderPipeline(sec, sets) {
    var h = "";
    h += '<h3>Usable answers and compiles, per stage</h3><div class="grid2">';
    sets.forEach(function (s) {
      h += '<div class="panel" id="' + s.id + '-bars"><div class="panel-title"><h3>' + esc(s.label) + '</h3><span class="cond">' + esc(s.conditions) + "</span></div>";
      h += '<div class="sub-h">Usable (same or close)</div><div class="bars">';
      sec.stages.forEach(function (st) { var r = s.stages[st.key]; if (r) h += barRow(st.label, null, r.usable); });
      h += '</div><div class="sub-h">Compiles, of those checkable</div><div class="bars">';
      sec.stages.forEach(function (st) {
        var r = s.stages[st.key]; if (!r) return;
        h += barRow(st.label, null, r.compiles, { note: r.unspliced ? "could not be spliced: " + r.unspliced[0] + " of " + r.unspliced[1] : null });
      });
      h += "</div></div>";
    });
    h += "</div>";

    h += '<h3 id="pipeline-mix">Verdict mix per stage</h3>' + legend(true) + '<div class="grid2">';
    sets.forEach(function (s) {
      h += '<div class="panel"><div class="panel-title"><h3>' + esc(s.label) + '</h3></div><div class="vrows">';
      sec.stages.forEach(function (st) { var r = s.stages[st.key]; if (r) h += stackRow(st.label, st.sub, r.verdicts, r.answers); });
      h += "</div></div>";
    });
    h += "</div>";

    var maxTok = 0;
    sets.forEach(function (s) { sec.stages.forEach(function (st) { var r = s.stages[st.key]; if (r && r.answerTokens > maxTok) maxTok = r.answerTokens; }); });
    h += '<h3 id="pipeline-tokens">Token cost per stage</h3><div class="grid2">';
    sets.forEach(function (s) {
      var rows = sec.stages.map(function (st) {
        var r = s.stages[st.key]; if (!r) return "";
        var w = Math.max(2, Math.round(60 * r.answerTokens / maxTok));
        return "<tr><td>" + esc(st.label) + '</td><td class="num">' + r.answers + '</td><td class="num">' + fmt(r.calls) + '</td><td class="num">' + fmt(r.promptTokens) +
          '</td><td class="num">' + fmt(r.answerTokens) + '<span class="minibar" style="width:' + w + 'px" aria-hidden="true"></span></td></tr>';
      }).join("");
      h += '<div class="panel"><div class="panel-title"><h3>' + esc(s.label) + "</h3></div>" +
        table(headRow([{ t: "Stage" }, { t: "Answers", cls: "num" }, { t: "Model calls", cls: "num" }, { t: "Prompt tokens", cls: "num" }, { t: "Answer tokens", cls: "num" }]), rows, "nowrap") + "</div>";
    });
    h += '</div><p class="note">' + esc(sec.tokenNote) + "</p>";

    h += '<h3>Other measurements</h3><div class="grid2">';
    sets.forEach(function (s) {
      h += '<div class="panel"><div class="panel-title"><h3>' + esc(s.label) + '</h3></div><ul class="findings">' + s.extra.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>";
    });
    h += "</div>";

    var tasks = Object.keys(sets[0].perTask);
    sets.slice(1).forEach(function (s) { Object.keys(s.perTask).forEach(function (t) { if (tasks.indexOf(t) < 0) tasks.push(t); }); });
    var head = '<tr><th scope="col" rowspan="2">Task</th>' + sets.map(function (s) { return '<th class="grp" colspan="' + sec.stages.length + '" scope="colgroup">' + esc(s.label) + "</th>"; }).join("") + "</tr><tr>" +
      sets.map(function () { return sec.stages.map(function (st, i) { return '<th scope="col" class="' + (i === 0 ? "gs" : "") + '">' + esc(st.label) + "</th>"; }).join(""); }).join("") + "</tr>";
    var notes = [];
    var rows = tasks.map(function (t) {
      return '<tr><td class="mono">' + esc(t) + "</td>" + sets.map(function (s) {
        var cells = s.perTask[t] || [];
        var fn = s.perTaskFootnotes && s.perTaskFootnotes[t];
        if (fn && notes.indexOf(fn) < 0) notes.push(fn);
        return sec.stages.map(function (st, i) {
          var c = cells[i];
          return '<td class="' + (i === 0 ? "gs" : "") + '">' + (c ? chips(c) : "") + (fn && i === 0 ? " *" : "") + "</td>";
        }).join("");
      }).join("") + "</tr>";
    }).join("");
    h += '<details id="pipeline-tasks"><summary>Per-task verdicts (' + tasks.length + " tasks)</summary>" + legend(true) +
      '<p class="note">' + esc(sec.perTaskNote) + "</p>" + table(head, rows, "nowrap stick", "tall stick") +
      notes.map(function (n) { return '<p class="note">* ' + esc(n) + "</p>"; }).join("") + "</details>";
    return h;
  }

  function perTaskTable(sec, sets, chipCells) {
    var withTasks = sets.filter(function (s) { return s.perTask; });
    if (!withTasks.length) return "";
    var tasks = sec.taskNames ? Object.keys(sec.taskNames) : Object.keys(withTasks[0].perTask);
    withTasks.forEach(function (s) { Object.keys(s.perTask).forEach(function (t) { if (tasks.indexOf(t) < 0) tasks.push(t); }); });
    var showDesc = sec.taskNames && sec.kind === "heldout";
    var cols = [{ t: "Task" }].concat(showDesc ? [{ t: "What it asks" }] : []).concat(withTasks.map(function (s) { return { t: s.label }; }));
    var rows = tasks.map(function (t) {
      var first = sec.kind === "heldout" ? '<td class="mono">' + esc(t) + "</td>" : "<td>" + esc((sec.taskNames && sec.taskNames[t]) || t) + "</td>";
      var desc = showDesc ? '<td style="white-space:normal;min-width:14em">' + esc(sec.taskNames[t] || "") + "</td>" : "";
      return "<tr>" + first + desc + withTasks.map(function (s) { var c = s.perTask[t]; return "<td>" + (c == null ? "" : chipCells ? chips(c) : esc(c)) + "</td>"; }).join("") + "</tr>";
    }).join("");
    return '<details id="' + sec.id + '-tasks"><summary>Per-task verdicts (' + tasks.length + " tasks)</summary>" + (chipCells ? legend(true) : "") +
      (sec.perTaskNote ? '<p class="note">' + esc(sec.perTaskNote) + "</p>" : "") + table(headRow(cols), rows, "nowrap stick", "stick" + (tasks.length > 15 ? " tall" : "")) + "</details>";
  }

  function renderHeldout(sec, sets) {
    var h = '<div class="panel" id="' + sec.id + '-mix"><div class="panel-title"><h3>Verdicts</h3><span class="cond">Usable means same or close</span></div>' + legend(true) + '<div class="vrows">';
    var lastGroup = null;
    sets.forEach(function (s) {
      if (s.group && s.group !== lastGroup) { h += '<div class="group-label">' + esc(s.group) + "</div>"; lastGroup = s.group; }
      h += stackRow(s.label, s.conditions, s.verdicts, s.answers);
    });
    h += "</div></div>";
    var rows = sets.map(function (s) { return "<tr><td>" + esc(s.label) + "</td>" + sec.table.map(function (c) { return cellValue(s, c); }).join("") + "</tr>"; }).join("");
    h += table(headRow([{ t: "Set" }].concat(sec.table.map(function (c) { return { t: c.label, cls: "num" }; }))), rows, "nowrap stick", "stick");
    if (sec.tableNote) h += '<p class="note">' + esc(sec.tableNote) + "</p>";
    h += perTaskTable(sec, sets, true);
    return h;
  }

  function renderSix(sec, sets) {
    var h = '<div class="grid3">';
    sec.metrics.forEach(function (m) {
      h += '<div class="panel" id="six-' + m.key + '"><div class="panel-title"><h3>' + esc(m.label) + '</h3><span class="cond">of 12 answers</span></div><div class="bars">';
      sets.forEach(function (s) { h += barRow(s.label, s.reference ? "reference" : null, s.scores[m.key], { ref: s.reference }); });
      h += "</div></div>";
    });
    h += '</div><p class="note">The hatched bar is Claude Haiku 5.5, the reference set.</p>';
    var rows = sets.map(function (s) {
      return "<tr><td>" + esc(s.label) + "</td><td>" + esc(s.date) + "</td>" + sec.metrics.map(function (m) { var f = s.scores[m.key]; return '<td class="num">' + f[0] + "/" + f[1] + "</td>"; }).join("") +
        '<td class="num">' + (s.answerTokensEstimated ? "~" + fmt(s.answerTokens) + " (est.)" : fmt(s.answerTokens)) + '</td><td style="min-width:16em">' + esc(s.closestClaude) + "</td><td>" + esc(s.grader) + "</td></tr>";
    }).join("");
    h += table(headRow([{ t: "Set" }, { t: "Graded" }].concat(sec.metrics.map(function (m) { return { t: m.label, cls: "num" }; })).concat([{ t: "Answer tokens", cls: "num" }, { t: "Closest Claude (est.)" }, { t: "Grader" }])), rows, "stick", "stick");
    var setup = sets.map(function (s) {
      return "<tr><td>" + esc(s.label) + "</td><td>" + esc(s.model) + "</td><td>" + esc(s.quant) + '</td><td style="min-width:12em">' + esc(s.gpu) + "</td><td>" + esc(s.kv) + "</td><td>" + esc(s.context) + '</td><td style="min-width:9em">' + esc(s.vram) + '</td><td class="num">' + esc(s.toks) + "</td></tr>";
    }).join("");
    h += '<details id="six-setup"><summary>Setup per set</summary>' +
      table(headRow([{ t: "Set" }, { t: "Model" }, { t: "Quant" }, { t: "GPU (power limit)" }, { t: "KV cache" }, { t: "Context" }, { t: "VRAM" }, { t: "tok/s", cls: "num" }]), setup, "stick", "stick") +
      '<p class="note">tok/s depends on the card and its power limit. VRAM is from /api/ps at that context.</p></details>';
    h += perTaskTable(sec, sets, false);
    return h;
  }

  function renderHistory(sec, sets) {
    var rows = sets.map(function (s) {
      var n = s.scoreNotes || {};
      function f(k) { var v = s.scores[k]; return v[0] + "/" + v[1] + (n[k] ? ' <span class="row-sub">(' + esc(n[k]) + ")</span>" : ""); }
      return "<tr><td>" + esc(s.label) + "</td><td>" + esc(s.think) + "</td><td>" + esc(s.rules) + "</td><td>" + f("firstTry") + "</td><td>" + f("rightAfterRepairs") +
        '</td><td class="num">' + fmt(s.answerTokens) + "</td><td>" + esc(s.closestClaude) + "</td></tr>";
    }).join("");
    var h = table(headRow([{ t: "Set" }, { t: "Think" }, { t: "Rules" }, { t: "First-try compiles" }, { t: "Right after ≤2 one-line repairs" }, { t: "Answer tokens", cls: "num" }, { t: "Closest Claude (est.)" }]), rows, "nowrap stick", "stick");
    h += perTaskTable(sec, sets, false);
    return h;
  }

  /* ---------- Page ---------- */
  var main = document.getElementById("main");
  document.getElementById("lede").textContent =
    "Measured results of local models writing C# for The Classrooms, newest first. Every number comes from the result files in Ollama-Hive and TheClassrooms-training; percentages are worked out on this page from the counts. Each section measured something different with different graders, so compare sets within a section, not across sections.";
  document.getElementById("toc").innerHTML = DATA.sections.map(function (s) { return '<a href="#' + s.id + '">' + esc(s.title) + "</a>"; }).join("");

  var html = "";
  DATA.sections.forEach(function (sec) {
    var sets = setsFor(sec.id);
    html += '<section class="block" id="' + sec.id + '" aria-labelledby="' + sec.id + '-h"><div class="sec-head"><h2 id="' + sec.id + '-h">' + esc(sec.title) + '</h2><span class="sec-date">' + esc(sec.date) + "</span></div>";
    html += '<p class="lede">' + esc(sec.about) + "</p>" + findingsList(sec.findings);
    try {
      if (sec.kind === "pipeline") html += renderPipeline(sec, sets);
      else if (sec.kind === "heldout") html += renderHeldout(sec, sets);
      else if (sec.kind === "six") html += renderSix(sec, sets);
      else if (sec.kind === "history") html += renderHistory(sec, sets);
    } catch (e) {
      html += '<p class="note">This section could not be drawn: ' + esc(e.message) + ". Check its entries in DATA.</p>";
    }
    html += caveatsBox(sec.caveats) + srcLine(sec.sources) + "</section>";
  });
  main.innerHTML = html;
  document.getElementById("foot").innerHTML = "<p>Data last updated " + esc(DATA.lastUpdated) + ". Source files: " +
    Object.keys(DATA.files).map(function (k) { return "<code>" + esc(DATA.files[k]) + "</code>"; }).join(", ") + ".</p><p>Kept in <code>Ollama-Hive/eval/dashboard/</code>; see its README.md to add a result set.</p>";
})();
</script>
